name: Kubernetes incident collector case study

on:
  push:
    branches: [main]
    paths:
      - "case-studies/kubernetes-incident-evidence-collector/**"
      - ".github/workflows/kubernetes-evidence-case.yml"
  pull_request:
    paths:
      - "case-studies/kubernetes-incident-evidence-collector/**"
      - ".github/workflows/kubernetes-evidence-case.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-studies/kubernetes-incident-evidence-collector
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked unit tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q collector.py tests
      - name: Validate synthetic JSON report
        run: python -m json.tool sample-report.json > /dev/null
